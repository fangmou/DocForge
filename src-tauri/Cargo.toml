[package]
name = "docforge"
version = "0.1.0"
description = "AI 原生、可扩展的本地 AsciiDoc 编辑器 — 为思想工程师而造"
license = "GPL-3.0-or-later"
authors = ["Fangmou <iaming@me.com>"]
repository = "https://github.com/fangmou/DocForge"
homepage = "https://github.com/fangmou/DocForge"
readme = "../README.adoc"
keywords = ["asciidoc", "editor", "ai", "tauri", "knowledge-graph"]
categories = ["text-editors", "development-tools"]
edition = "2021"

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
once_cell = "1"
which = "6"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
